  note: 'GUARD -- DO NOT RECONSTRUCT AN OPENAPI FROM THE DOCS. The documentation page states in its own
    implementation notice that its base URL, endpoint paths, auth header, field names, quotas and
    example responses are examples, rooted at api.example.com. api.cricket-api.net does not resolve,
    and tennis-api.net serves a byte-identical template -- the cricket-api.net home page still loads
    /wp-content/uploads/2026/05/cropped-tennis-api-favicon.png, so the site is a clone of the tennis
    template with the sport swapped. A generated contract would describe a service the page itself
    calls hypothetical. If the provider supplies a confirmed production base URL, harvest the real
    thing and delete this note. Probed 2026-09-03: site 200, docs 200, control path 404. Re-probed
    2026-09-04: unchanged.'
