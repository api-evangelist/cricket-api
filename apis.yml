name: Cricket API
description: 'A cricket data API advertised at cricket-api.net -- live scores, fixtures, ball-by-ball
  events, player and team statistics, betting odds and win-probability predictions, over REST and a
  documented WebSocket stream. ACCESS REALITY, stated plainly: the production base URL is not
  published; the docs describe every endpoint against the placeholder api.example.com and carry their
  own implementation notice that the base URL, paths, headers, quotas and responses are documentation
  examples to be replaced after signup. Four plan tiers are named but no price or quota is published
  for any of them. Listed on the surfaces that are actually served; the rating reflects what is
  published.'
